implementation_version: 2
training_profile: stable_static_sac
seed: 0
device: cpu
dataset:
  root: ../../DataSet_AE
  side: left
  validation_scenes:
  - indoor_class_room4_263Lux
  - indoor_common_room2_95Lux
  - outdoor_bicycle2_2680Lux
  - outdoor_car6_4539Lux
  eval_scenes:
  - indoor_lounage1_200Lux
  - indoor_meeting_room2_191Lux
  - outdoor_car5_5290Lux
  - outdoor_weed1_3350Lux
state:
  width: 128
  height: 128
  history: 3
  randomization: true
  min_crop_fraction: 0.5
  include_controls: true
reward:
  mode: mean_target
  target: 0.5
  exponent: 1.0
  brightness_weight: 1.5
  flicker_weight: 1.0
  noise_weight: 0.1
env:
  max_steps: 200
  action_fraction: 0.1
  flicker_threshold: 0.01
  convergence_patience: 3
  brightness_tolerance: 0.1
  outward_clip_penalty: 0.05
  terminate_on_success: true
curriculum:
  enabled: true
  easy_until: 25000
  normal_until: 45000
  final_probabilities:
  - 0.1
  - 0.4
  - 0.5
  reset_candidates: 8
  lighting_proxy: none
  change_every: 20
  illumination_range:
  - 0.25
  - 4.0
sac:
  hidden:
  - 256
  - 256
  - 256
  learning_rate: 0.0001
  temperature_learning_rate: 0.0001
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  replay_capacity: 1000000
  random_steps: 10000
  initial_temperature: 0.2
  learn_temperature: true
  min_temperature: 0.01
  max_temperature: 0.5
  log_std_min: -5.0
  log_std_max: 2.0
  gradient_clip_norm: 5.0
  critic_loss_kind: huber
  q_abs_limit: 1000.0
train:
  steps: 500000
  log_every: 200
  evaluate_every: 2000
  validation_episodes_per_scene: 3
  checkpoint_metric: success_then_brightness
  early_stopping_patience: 0
  early_stopping_min_steps: 60000
  output: ../runs
